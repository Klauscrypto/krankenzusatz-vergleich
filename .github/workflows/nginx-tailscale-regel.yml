name: nginx-Tailscale-Regel einrichten
# Einmalig 22.11.2026: systemd-Drop-in für nginx. Vor jedem nginx-Start gibt Tailscale Serve Port 443 frei,
# danach übernimmt es den Jarvis-Chat wieder (127.0.0.1:3110). Verhindert den Ausfall vom 22.11. (bind [::]:443 belegt).
on: workflow_dispatch
jobs:
  regel:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            TS=$(command -v tailscale); echo "tailscale: $TS"
            mkdir -p /etc/systemd/system/nginx.service.d
            cat > /etc/systemd/system/nginx.service.d/tailscale-443.conf <<CONF
            # Eingerichtet 22.11.2026 (Claude): Port-Konflikt nginx <-> Tailscale Serve auf 443 vermeiden.
            # Tailscale Serve gibt 443 vor dem Start frei und übernimmt den Jarvis-Chat danach wieder.
            [Service]
            ExecStartPre=-$TS serve --https=443 off
            ExecStartPost=-$TS serve --bg --https=443 http://127.0.0.1:3110
            CONF
            sed -i 's/^ *//' /etc/systemd/system/nginx.service.d/tailscale-443.conf
            cat /etc/systemd/system/nginx.service.d/tailscale-443.conf
            systemctl daemon-reload
            nginx -t
            echo "== Test: nginx neu starten"
            systemctl restart nginx || { sleep 2; systemctl start nginx; }
            sleep 2; echo "nginx: $(systemctl is-active nginx)"
            tailscale serve status | head -3
            for d in crm.pilsner-vertrieb.de pilsner-vertrieb.de sanitaer-heizung-deggendorf.de waerme-kraft.com; do
              printf "%-34s %s\n" $d $(curl -s -o /dev/null -w "%{http_code}" -m 10 https://$d/); done
